clamd:
  tcp:
    addr: "localhost:3310"
  unix:
    path: ""

rabbitmq:
  host: "127.0.0.1"
  port: 5672
  username: ""
  password: ""

  # Main exchange
  exchange: "uploader.exchange"

  # Dead-letter exchange (receives permanently failed messages)
  dlx: "uploader.dlx"

  # Queues
  scanQueue: "q.file.scan"
  cancelQueue: "q.case.cancelled"

  # Routing keys for outbound publishes
  scanCompletedRoutingKey: "file.scan.completed"
  scanRetryingRoutingKey: "file.scan.retrying"
  dlqRoutingKey: "file.scan.failed"
  scanStartedRoutingKey: "file.scan.started"

  # Consumer QoS
  prefetchCount: 1

redis:
  # Set enabled: false to skip all Redis connection attempts.
  # ClamGo uses in-memory cancellation tracking only (via HandleCancelMessage).
  # Set to true and configure addr or cluster.nodes to re-enable the Redis fast-check.
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

  cluster:
    enabled: false
    nodes: []
    password: ""
    maxRedirects: 10

tempNFS:
  # ClamGo rejects file paths that do not start with this prefix.
  prefix: "/mnt/temp-nfs/"

health:
  port: 8080

logging:
  level: "info"
